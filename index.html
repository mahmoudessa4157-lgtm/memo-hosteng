here<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M3MO Hosting</title>
<style>
  :root { --bg:#050505; --panel:#111; --text:#0f0; --accent:#ff003c; --border:#333; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Courier New', monospace; }
  body { background:var(--bg); color:#ccc; display:flex; justify-content:center; align-items:center; height:100vh; }
  .box { width:100%; max-width:500px; background:var(--panel); padding:30px; border:1px solid var(--border); border-radius:10px; box-shadow:0 0 20px rgba(255,0,60,0.2); }
  h1 { color:var(--accent); text-align:center; margin-bottom:20px; font-size:24px; text-shadow:0 0 10px var(--accent); }
  .input-group { margin-bottom:15px; }
  label { display:block; margin-bottom:5px; font-size:12px; color:#888; }
  input { width:100%; padding:12px; background:#000; border:1px solid var(--border); color:var(--text); border-radius:4px; outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 5px var(--accent); }
  button { width:100%; padding:15px; background:var(--accent); color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer; transition:0.3s; font-size:16px; }
  button:hover { background:#cc0030; box-shadow:0 0 15px var(--accent); }
  .logs { margin-top:20px; background:#000; padding:15px; border:1px solid var(--border); border-radius:4px; height:120px; overflow-y:auto; font-size:12px; color:var(--text); }
</style>
</head>
<body>

<div class="box">
  <h1>M3MO BOT HOSTING</h1>
  
  <div class="input-group">
    <label>Bot Token (من BotFather)</label>
    <input type="text" id="botToken" placeholder="8781731878:AAFu...">
  </div>
  
  <button onclick="deployBot()" id="btn">Deploy Webhook 🚀</button>
  
  <div class="logs" id="logs">> System Ready...</div>
</div>

<script>
  async function deployBot() {
    const token = document.getElementById('botToken').value.trim();
    const btn = document.getElementById('btn');
    const logs = document.getElementById('logs');
    
    if (!token) { logs.innerHTML = "> [ERROR] حط التوكن يا ملك!"; return; }
    
    btn.disabled = true;
    btn.innerText = "جاري التشغيل...";
    logs.innerHTML += "<br>> Connecting to Telegram API...";
    
    const domain = window.location.origin;
    const webhookUrl = domain + "/api/webhook?token=" + token;
    
    try {
      const res = await fetch('/api/setup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, webhookUrl })
      });
      const data = await res.json();
      
      if (data.ok) {
        logs.innerHTML += "<br>> [SUCCESS] تم ربط البوت بنجاح!";
        logs.innerHTML += "<br>> البوت شغال ٢٤/٧ على Vercel الآن.";
        btn.innerText = "البوت شغال ✅";
        btn.style.background = "#00aa00";
      } else {
        logs.innerHTML += "<br>> [ERROR] " + data.description;
        btn.disabled = false;
        btn.innerText = "Deploy Webhook 🚀";
      }
    } catch (e) {
      logs.innerHTML += "<br>> [CRITICAL] فشل الاتصال بالسيرفر.";
      btn.disabled = false;
      btn.innerText = "Deploy Webhook 🚀";
    }
    logs.scrollTop = logs.scrollHeight;
  }
</script>
</body>
</html>
